# 长稳测试（soak）：在真实 pigo serve 守护进程、真实 unix socket / 命名管道和真实
# 多客户端抖动下跑够 N 分钟。
#
# 三个触发口，跑的是同一份实现（workflow_call 让 ci.yml 不必复制步骤，否则两处一定
# 会漂移）：
#   push / PR   ci.yml 调用，10 分钟，和测试并行，回归在同一次提交上就报出来
#   定时        每天北京时间 09:30，跑满 2 小时，代码没变的日子也能发现偶发问题
#   手动        可选 10m..5h，用来压长尾问题
#
# 定时那一轮的 2 小时是需求而不是默认值：十分钟只够走完常见路径，长会话压缩、反复
# 重连接管、慢泄漏都要更长时间才显形。它由 SOAK_MIN_DURATION 兜底校验，改小了会当场
# 失败，而不是悄悄退化成一次冒烟。
#
# 顺序固定：先构建、vet、跑全量测试，全部通过才开始长稳——长稳要占用十几分钟到两
# 小时的 runner 时间，不该为一次编译错误白跑。定时与手动触发时，任何一步失败（含长稳本身
# 失败）都会自动开一条 issue；当天重复失败只在原 issue 下追加评论。CI 调用时不报
# issue：失败已经挂在对应的 commit / PR 上，再开一条只是把同一个信号说两遍。
name: soak

on:
  schedule:
    # 北京时间每天 09:30。
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "长稳时长（Go duration，必须 ≥ 10m 且不超过 5h）"
        required: true
        default: "10m"
      race:
        description: "用 -race 构建 pigo 再跑（更慢，但能把数据竞争变成失败）"
        type: choice
        options: ["true", "false"]
        default: "true"
      seed:
        description: "确定性种子，留空则按时间生成"
        required: false
        default: ""
  # ci.yml 在每次 commit 与 PR 上调用，跑 10 分钟版本。
  workflow_call:
    inputs:
      duration:
        description: "长稳时长（Go duration，必须 ≥ 10m 且不超过 5h）"
        required: false
        type: string
        default: "10m"
      race:
        description: "用 -race 构建 pigo 再跑（\"true\" / \"false\"）"
        required: false
        type: string
        default: "true"
      timeout_minutes:
        description: "job 级超时（分钟）；CI 里只需几十，手动压长尾时才要 340"
        required: false
        type: number
        default: 340
      seed:
        description: "确定性种子，留空则按时间生成"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  # 上报 issue 需要写权限，GITHUB_TOKEN 默认没有。
  #
  # 这行有个不明显的副作用：GitHub 在启动时校验「调用方 job 授予的权限必须覆盖被
  # 调用工作流声明的权限」，声明的权限（无论写在 workflow 级还是 job 级）少一个都
  # 会让调用方的 run 直接 startup_failure——不是运行到那一步才 403，而是整个工作流
  # 根本起不来。所以 ci.yml 的 soak job 必须一起授予它，见那边的注释。
  issues: write

# 同一分支上的长稳不要叠加：连续推送会排出一条十分钟的队列，反馈越来越滞后。PR
# 上直接取消旧的（新提交已经取代它）；master 与定时触发不取消，免得把一轮跑了大半
# 的长稳白扔——新的那轮会等它结束。见 jobs.soak.concurrency。
#
# 放在 job 级：GitHub 只承诺「调用方 job 上的 jobs.<id>.concurrency」有效，被调用时
# workflow 级的并发块行为没有明确约定，而两处同名很容易互相取消（文档明确警告：
# 调用方与被调用方用同一个 group 且 cancel-in-progress 为真，会取消正在跑的那个）。

jobs:
  soak:
    name: Soak (${{ github.event_name == 'schedule' && '2h' || inputs.duration || '10m' }})
    runs-on: ubuntu-latest
    concurrency:
      # 事件名也在 group 里：定时那一轮要跑满 2 小时，若与「每次提交的 10 分钟」
      # 共用一条队列（且不取消），这两小时里 push 上来的 CI 长稳会一直 pending，
      # 反馈被拖到两小时后。分开之后定时、手动、提交各走各的道；同一 ref 的连续
      # push 仍然串行，PR 仍然取消旧的那轮。
      group: soak-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # GitHub 托管 runner 的 job 上限是 6 小时（360 分钟）。5h 长稳 + 15 分钟
    # 安全网 + 构建/测试余量，340 既够用也不会被平台先截断。定时那轮是 2 小时，
    # 加上前置构建与全量测试仍远在 340 之内；CI 里只跑 10 分钟，调用方传 40，
    # 挂住时就不必占着 runner 到平台的硬上限。
    timeout-minutes: ${{ inputs.timeout_minutes || 340 }}

    env:
      # 定时那一轮固定 2 小时。事件名放在最前面而不是靠 inputs 为 null 时的兜底：
      # 「定时 = 2 小时」是需求，不该依赖一个隐式的空值语义。其余触发口按传入值，
      # workflow_call 与 workflow_dispatch 都声明了 10m 的默认值。
      SOAK_DURATION: ${{ github.event_name == 'schedule' && '2h' || inputs.duration || '10m' }}
      # 定时触发的下限。单靠上面的表达式不够：有人把它改成 30m 时，这里会让定时
      # 长稳在第一步就失败，而不是悄悄跑成一次冒烟。
      SOAK_MIN_DURATION: ${{ github.event_name == 'schedule' && '2h' || '10m' }}
      SOAK_SEED: ${{ inputs.seed || '' }}
      # race 输入是字符串而不是 boolean，正是为了避开下面这个坑：GitHub 的表达式
      # 在类型不同时按数字比较，null→0、false→0，于是 `inputs.race == false` 在
      # 「inputs 整个为 null」（定时触发）时也为 **true**，定时任务反而会关掉 race。
      # 字符串没有这个歧义：null || 'true' 就是 'true'，显式传 "false" 才是 false。
      SOAK_RACE: ${{ inputs.race || 'true' }}
      # 单个 job 跑不完更长的时长，越界时在第一步就明确报错，而不是被硬杀。
      SOAK_MAX_DURATION: 5h
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      # 下限写死在脚本里而不是依赖 input 的默认值：手动触发时把 duration 改成 30s
      # 也应该被拦下来，否则「十分钟的长稳」会悄悄退化成一次冒烟。
      - name: Check duration
        id: duration
        run: |
          seconds=$(bash .github/scripts/soak-duration.sh "$SOAK_DURATION" "$SOAK_MIN_DURATION" "$SOAK_MAX_DURATION")
          echo "seconds=$seconds" >>"$GITHUB_OUTPUT"
          echo "请求时长 $SOAK_DURATION（${seconds}s），允许范围 $SOAK_MIN_DURATION..$SOAK_MAX_DURATION"

      # ---- 冒烟阶段：构建 + 测试，全绿才值得占用十分钟 ----

      - name: Build
        id: build
        run: go build ./...

      - name: Vet
        id: vet
        run: go vet ./...

      - name: Test
        id: test
        run: go test -race ./...

      - name: Build pigo for the soak
        id: binary
        run: |
          # -race 让数据竞争从「偶发线上问题」变成当场失败，值得用更多 CPU 换来。
          # 它只支持本 job 所在的 linux/amd64，正好够用。
          if [ "$SOAK_RACE" = "true" ]; then
            go build -race -o pigo-soak ./cmd/pigo
            echo "已构建 -race 版 pigo"
          else
            go build -o pigo-soak ./cmd/pigo
            echo "已构建普通 pigo"
          fi

      - name: Build longstay
        id: harness
        run: |
          # 先编译成独立二进制再运行，而不是 go tool longstay：go tool 是父进程，
          # timeout 的 SIGINT 只会送到它，长稳进程收不到，最终被 SIGKILL，什么都写不出来。
          go build -o longstay ./e2e/longstay

      # ---- 长稳阶段 ----

      - name: Run longstay
        id: longstay
        env:
          SOAK_SECONDS: ${{ steps.duration.outputs.seconds }}
        run: |
          set -o pipefail
          args=(-duration "$SOAK_DURATION" -pigo "$PWD/pigo-soak" -output e2e-results/soak)
          if [ -n "$SOAK_SEED" ]; then
            args+=(-seed "$SOAK_SEED")
          fi
          echo "./longstay ${args[*]}"

          # 安全网：harness 自己按 -duration 停止，这里只在它卡死时兜底。--signal=INT
          # 走 harness 的优雅关闭路径（停客户端 → 最终重连验证 → 关 host），仍能写出
          # summary.json；只有 120s 后还不退才 SIGKILL。
          # GORACE=halt_on_error=1：检测到竞争立即让 host 退出，长稳因此失败并留下
          # server.log 里的完整竞争栈，而不是打完警告继续跑完两小时。
          start=$(date +%s)
          rc=0
          GORACE=halt_on_error=1 \
            timeout --signal=INT --kill-after=120s "$((SOAK_SECONDS + 900))s" \
            ./longstay "${args[@]}" 2>&1 | tee longstay.log || rc=$?
          elapsed=$(( $(date +%s) - start ))

          # 提前退出的判定必须自己写。longstay 把 SIGINT 当作「正常停止」——它做完整
          # 的优雅关闭后返回 0，因为那在交互使用下是对的。但在这里，被 timeout 打断
          # 恰恰说明卡住了：跑完 summary 也可能写着 pass=true。所以按墙钟时长兜底，
          # 允许 120s 的收尾与调度误差。
          if [ "$elapsed" -lt $((SOAK_SECONDS - 120)) ]; then
            echo "::error::longstay 只运行了 ${elapsed}s，少于请求的 ${SOAK_SECONDS}s（提前退出，或被 timeout 的 SIGINT 打断）"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::longstay 退出码 $rc"
            exit "$rc"
          fi
          echo "长稳跑满 ${elapsed}s，未发现问题"

      # ---- 结果整理与上报：无论成败都跑 ----

      - name: Summarize
        if: always()
        run: |
          {
            echo "## 长稳结果（$SOAK_DURATION）"
            echo
            bash .github/scripts/soak-summary.sh e2e-results/soak/summary.json
          } >>"$GITHUB_STEP_SUMMARY"

      # artifact 只收脱敏后的尾巴。home/ 含 server.token 与 session 提示词，公开
      # 仓库的 artifact 谁都能下载（见 e2e/longstay/README.md 的安全提示）；事件的
      # events.jsonl 也可能很大，不适合整体上传。
      - name: Collect sanitized evidence
        if: always()
        run: |
          mkdir -p evidence
          cp -f e2e-results/soak/summary.json evidence/ 2>/dev/null || true
          cp -f e2e-results/soak/config.json evidence/ 2>/dev/null || true
          [ -f e2e-results/soak/server.log ] &&
            tail -n 800 e2e-results/soak/server.log >evidence/server.log.tail || true
          [ -f longstay.log ] && tail -n 500 longstay.log >evidence/longstay.log.tail || true
          [ -f e2e-results/soak/events.jsonl ] &&
            tail -n 200 e2e-results/soak/events.jsonl >evidence/events.jsonl.tail || true
          # 协议违例整轮保留：events.jsonl 太密，尾部 200 行只够十几秒，而失败时
          # 第一手线索就在这里（harness 已把它单独写成有界文件）。
          cp -f e2e-results/soak/protocol-errors.log evidence/ 2>/dev/null || true
          du -sh e2e-results/soak 2>/dev/null || true
          ls -la evidence

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: evidence/

      # 只要有任何一步没成功就开 issue。用 failure()：被 timeout 包裹的 longstay 以
      # 124/130 退出同样算失败，而 cancelled（人主动停掉）不该开 issue。
      - name: Open or update failure issue
        id: report
        # 只有定时与手动触发才报 issue：CI 里失败已经挂在 commit / PR 上，再开一条
        # 只是把同一个信号说两遍；fork PR 的 token 还是只读的，写 issue 会变红。
        #
        # 用白名单而不是「不等于 workflow_call」：GitHub 文档说被调用工作流的 github
        # 上下文关联的是调用方，于是那里的 event_name 是 push / pull_request 而不是
        # workflow_call。无论语义如何，push 和 pull_request 都不等于 schedule 或
        # workflow_dispatch，白名单在两种情况下都正确。
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          # 失败步骤直接从各 step 的 outcome 拼出来，带上中文名便于阅读。
          OUTCOME_DURATION: ${{ steps.duration.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_VET: ${{ steps.vet.outcome }}
          OUTCOME_TEST: ${{ steps.test.outcome }}
          OUTCOME_BINARY: ${{ steps.binary.outcome }}
          OUTCOME_HARNESS: ${{ steps.harness.outcome }}
          OUTCOME_LONGSTAY: ${{ steps.longstay.outcome }}
        run: |
          failed=""
          for pair in \
            "OUTCOME_DURATION:时长校验" \
            "OUTCOME_BUILD:构建" \
            "OUTCOME_VET:vet" \
            "OUTCOME_TEST:测试" \
            "OUTCOME_BINARY:构建 pigo" \
            "OUTCOME_HARNESS:构建 longstay" \
            "OUTCOME_LONGSTAY:长稳"; do
            var=${pair%%:*}
            name=${pair#*:}
            outcome=${!var:-skipped}
            if [ "$outcome" != "success" ] && [ "$outcome" != "skipped" ]; then
              failed="${failed:+$failed, }$name($outcome)"
            fi
          done

          repro="go tool longstay -duration $SOAK_DURATION"
          if [ "$SOAK_RACE" = "true" ]; then
            repro="go build -race -o pigo-soak ./cmd/pigo && go tool longstay -duration $SOAK_DURATION -pigo ./pigo-soak"
          fi

          log_arg=()
          [ -f longstay.log ] && log_arg=(--log longstay.log)

          bash .github/scripts/soak-report.sh \
            --summary e2e-results/soak/summary.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --run-id "${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --ref "${{ github.ref_name }}" \
            --duration "$SOAK_DURATION" \
            --failed "${failed:-未知步骤}" \
            --protocol evidence/protocol-errors.log \
            "${log_arg[@]}" \
            --repro "$repro" >soak-report.md

          bash .github/scripts/soak-failure-issue.sh soak-report.md

      # 让失败在 run 页面上直接可点，而不是藏在日志末尾。
      - name: Link the issue in the summary
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          issue="${{ steps.report.outputs.issue }}"
          if [ -n "$issue" ]; then
            echo "" >>"$GITHUB_STEP_SUMMARY"
            echo "已上报：${{ github.server_url }}/${{ github.repository }}/issues/$issue" \
              >>"$GITHUB_STEP_SUMMARY"
          fi
